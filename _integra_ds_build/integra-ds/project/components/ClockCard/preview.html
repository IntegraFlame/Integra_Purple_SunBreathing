<!-- @dsCard group="Data display" height=340 subtitle="Digital clock card and the celestial-kinematics readout" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0 }
  body { background: var(--void); color: var(--monolith); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; padding: 16px }
  .line { font-size: 0.65rem; margin-top: 0.6rem }
</style>
</head><body>
<div class="ig-grid ig-grid--2">
  <div class="ig-card ig-card--compact">
    <div class="ig-card-label" style="color:var(--purple-neon)">🕐 Digital Clock [CDT]</div>
    <div class="ig-clock">
      <div class="ig-clock-time">14:07:32 CDT</div>
      <div class="ig-clock-date">Monday, September 21, 2026</div>
    </div>
  </div>
  <div class="ig-card ig-card--compact ig-card--celestial">
    <div class="ig-card-label" style="color:var(--celestial-indigo)">🌍 Celestial Kinematics</div>
    <div class="ig-celestial-label">EARTH AXIAL ROTATION</div>
    <div class="ig-celestial-readout" style="font-size:1.8rem;margin-top:0.2rem">66.7270°</div>
    <div class="line" style="color:var(--celestial-indigo)">Kepler Orbital: <span class="ig-celestial-value">0.9451</span></div>
    <div class="line" style="color:var(--celestial-indigo)">Lunar Phase: <span class="ig-celestial-value">0.1595</span></div>
  </div>
</div>
</body></html>
