<!-- @dsCard group="Ambient" height=300 subtitle="Glow ring and the 80-particle canvas that sit behind page content" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100% }
  body { background: var(--void); color: var(--monolith); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; position: relative; overflow: hidden }
  /* In a page these two are position: fixed; the specimen contains them in the frame. */
  .ig-particles, .ig-glow-ring { position: absolute }
  .content { position: relative; z-index: 2; padding: 16px; max-width: 420px }
</style>
</head><body>
<canvas id="particles" class="ig-particles"></canvas>
<div class="ig-glow-ring"></div>
<div class="content">
  <div class="ig-card ig-card--compact">
    <div class="ig-card-label">Ambient layer</div>
    <div style="color:var(--monolith-dim)">The particle canvas sits at z-index 0, the glow ring at 1, page content at 2.</div>
  </div>
</div>
<script>
  // Mirrors the particle script in integra_logo_live.html and static/dashboard.html.
  (function () {
    var canvas = document.getElementById('particles');
    var ctx = canvas.getContext('2d');
    var particles = [];
    var colors = [[0, 240, 255], [157, 0, 255], [255, 122, 0], [255, 170, 51]]; // sentinel-cyan, purple-neon, flame-primary, flame-core
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();
    function Particle() { this.reset(); }
    Particle.prototype.reset = function () {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.radius = Math.random() * 1.5 + 0.3;
      var o = Math.random() * 0.4 + 0.1;
      var c = colors[Math.floor(Math.random() * colors.length)];
      this.color = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + o + ')';
    };
    Particle.prototype.update = function () {
      this.x += this.vx; this.y += this.vy;
      if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
    };
    Particle.prototype.draw = function () {
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = this.color; ctx.fill();
    };
    for (var i = 0; i < 80; i++) particles.push(new Particle());
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function (p) { if (!reduce) p.update(); p.draw(); });
      if (!reduce) requestAnimationFrame(frame);
    }
    frame();
  })();
</script>
</body></html>
