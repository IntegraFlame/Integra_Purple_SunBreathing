<!-- @dsCard group="Brand" height=700 subtitle="Wordmark, tagline, version badge and telemetry readout, beside the supplied logo files" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0 }
  body { background: var(--void); color: var(--monolith); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; padding: 16px }
  .cap { font-family: var(--font-primary); font-size: 0.55rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--monolith-dim); margin: 16px 0 8px }
  .stage { border: 1px solid var(--card-border); border-radius: var(--radius-lg) }
  .logos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px }
  .logos img { display: block; width: 100%; height: auto; border-radius: var(--radius-lg) }
</style>
</head><body>
<p class="cap" style="margin-top:0">Live type lockup</p>
<div class="stage">
  <div class="ig-logo">
    <h1 class="ig-wordmark">Integra</h1>
    <p class="ig-tagline">Infinite Living Flame</p>
    <div class="ig-logo-divider"></div>
    <div class="ig-version">v8.2.2 — Purple Epiphany</div>
    <div class="ig-telemetry">
      <span>ω = <span class="ig-val">1.00</span></span>
      <span>ΔE = <span class="ig-val">0.0000</span></span>
      <span>KL = <span class="ig-val">0.000</span></span>
      <span>H<sub>smooth</sub> = <span class="ig-val">0.00</span></span>
    </div>
  </div>
</div>
<p class="cap">Supplied logo files: IntegraLogoCOLOR2026.png and BESTIntegraLogoCOLOR2026resized.jpg</p>
<div class="logos">
  <img src="/_blob/a362f8f849cc563bdb17cce63a640b29" alt="Integra logo in color, PNG: white wordmark over a cyan-to-orange tagline on black">
  <img src="/_blob/9bdfe3030be99f16fdf1b8a37df0b74b" alt="Integra logo in color, larger resized JPG">
</div>
</body></html>
