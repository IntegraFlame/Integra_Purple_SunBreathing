<!-- @dsCard group="Status" height=330 subtitle="Live dot, kernel pill, protocol badges and glowing status text" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0 }
  body { background: var(--void); color: var(--monolith); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; padding: 16px }
  .cap { font-family: var(--font-primary); font-size: 0.55rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--monolith-dim); margin: 20px 0 8px }
  .cap:first-child { margin-top: 0 }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
  .st { font-family: var(--font-primary); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.08em }
</style>
</head><body>
<p class="cap">Live dot and kernel pill</p>
<div class="row">
  <span><span class="ig-live-dot"></span>OPERATIONAL</span>
  <span><span class="ig-live-dot ig-live-dot--off"></span>INACTIVE</span>
  <div class="ig-kernel"><span class="ig-kernel-dot"></span><span>LIVE</span></div>
  <div class="ig-kernel ig-kernel--off"><span class="ig-kernel-dot"></span><span>INACTIVE</span></div>
</div>
<p class="cap">Protocol badges</p>
<div class="row">
  <span class="ig-proto ig-proto--on">ALWAYS ON</span>
  <span class="ig-proto ig-proto--on">ARMED</span>
  <span class="ig-proto ig-proto--ready">READY</span>
  <span class="ig-proto ig-proto--active">ACTIVE (2)</span>
  <span class="ig-proto ig-proto--standby">STANDBY</span>
</div>
<p class="cap">Status text</p>
<div class="row" style="gap:28px">
  <span class="st ig-status-ok">OK</span>
  <span class="st ig-status-alert">ALERT</span>
  <span class="st ig-status-sovereign">SOVEREIGN</span>
</div>
</body></html>
