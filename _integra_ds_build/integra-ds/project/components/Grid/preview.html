<!-- @dsCard group="Layout" height=520 subtitle="2, 3, 4 and 6-column grids and the two page widths" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0 }
  body { background: var(--void); color: var(--monolith); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; padding: 16px }
  .cap { font-family: var(--font-primary); font-size: 0.55rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--monolith-dim); margin: 20px 0 8px }
  .cap:first-child { margin-top: 0 }
  .cell { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; color: var(--flame-core); font-weight: 700 }
  .bar { height: 10px; border-radius: var(--radius-xs); background: var(--purple-dim); border: 1px solid var(--card-border); margin-bottom: 6px; position: relative }
  .bar > span { position: absolute; left: 0; top: -2px; font-family: var(--font-primary); font-size: 0.5rem; color: var(--monolith-dim); transform: translateY(-100%) }
</style>
</head><body>
<p class="cap">ig-grid--2 · gap 1rem · single column under 960px</p>
<div class="ig-grid ig-grid--2"><div class="cell">1</div><div class="cell">2</div></div>
<p class="cap">ig-grid--3 · gap 0.6rem · two columns under 960px</p>
<div class="ig-grid ig-grid--3"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div></div>
<p class="cap">ig-grid--4 · gap 0.5rem</p>
<div class="ig-grid ig-grid--4"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div></div>
<p class="cap">ig-grid--6 · gap 0.3rem · three columns under 960px</p>
<div class="ig-grid ig-grid--6"><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell">4</div><div class="cell">5</div><div class="cell">6</div></div>
<p class="cap">Page widths</p>
<div style="max-width:960px"><div class="bar"><span>ig-page · 960px · report column</span></div></div>
<div style="max-width:1440px;margin-top:22px"><div class="bar"><span>ig-page--wide · 1440px · dashboard</span></div></div>
</body></html>
