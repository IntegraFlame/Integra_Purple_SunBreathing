<!-- @dsCard group="Surfaces" height=300 subtitle="Standard report card, compact dashboard card and the celestial card" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0 }
  body { background: var(--void); color: var(--monolith); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; padding: 16px }
  .cap { font-family: var(--font-primary); font-size: 0.55rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--monolith-dim); margin: 0 0 8px }
  p { margin: 0; color: var(--monolith-dim) }
</style>
</head><body>
<div class="ig-grid ig-grid--3">
  <div>
    <p class="cap">Standard</p>
    <div class="ig-card">
      <div class="ig-card-label">Fed Funds Rate</div>
      <p>+25 bps at the Sept 16 FOMC, to 3.75%–4.00%. Unanimous, 12–0.</p>
    </div>
  </div>
  <div>
    <p class="cap">Compact</p>
    <div class="ig-card ig-card--compact">
      <div class="ig-card-label" style="color:var(--sentinel-cyan)">Cognitive Health Matrix</div>
      <p>Eleven lobes report to the Heimdall health endpoint.</p>
    </div>
  </div>
  <div>
    <p class="cap">Celestial</p>
    <div class="ig-card ig-card--compact ig-card--celestial">
      <div class="ig-card-label" style="color:var(--celestial-indigo)">Celestial Kinematics</div>
      <p>Earth axial rotation and lunar phase, in the indigo accent.</p>
    </div>
  </div>
</div>
</body></html>
